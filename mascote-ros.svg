<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Ros, o mascote do Rafael</title>
  <desc id="d">Um bichinho roxo de estilo cartoon, com coroa dourada e fones de ouvido verdes, que balança, pisca e acena.</desc>
  <defs>
    <clipPath id="mouth"><path d="M178 248 Q200 284 222 248 Z"/></clipPath>
  </defs>
  <style>
    .bob{animation:bob 2.4s ease-in-out infinite}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
    .shadow{transform-box:fill-box;transform-origin:center;animation:sh 2.4s ease-in-out infinite}
    @keyframes sh{0%,100%{transform:scaleX(1);opacity:.22}50%{transform:scaleX(.86);opacity:.12}}
    .eyes{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
    @keyframes blink{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}}
    .pupils{animation:look 6s ease-in-out infinite}
    @keyframes look{0%,100%{transform:translateX(0)}30%{transform:translateX(4px)}60%{transform:translateX(-4px)}}
    .wave{transform-origin:296px 252px;animation:wave 1.6s ease-in-out infinite}
    @keyframes wave{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-30deg)}}
    .crown{transform-origin:200px 104px;animation:tilt 3s ease-in-out infinite}
    @keyframes tilt{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
    .note{opacity:0;animation:float 4s ease-in infinite}
    .n2{animation-delay:2s}
    @keyframes float{0%{transform:translateY(20px);opacity:0}20%{opacity:1}100%{transform:translateY(-50px);opacity:0}}
    .spark{transform-box:fill-box;transform-origin:center;animation:tw 2s ease-in-out infinite}
    .s2{animation-delay:1s}
    @keyframes tw{0%,100%{transform:scale(.4);opacity:.4}50%{transform:scale(1);opacity:1}}
  </style>

  <ellipse class="shadow" cx="200" cy="364" rx="92" ry="12" fill="#000"/>

  <g class="note n1" fill="#22c55e">
    <ellipse cx="78" cy="132" rx="9" ry="7" transform="rotate(-20 78 132)"/>
    <path d="M86 130 V98 Q98 100 100 114" fill="none" stroke="#22c55e" stroke-width="4" stroke-linecap="round"/>
  </g>
  <g class="note n2" fill="#fbbf24">
    <ellipse cx="322" cy="150" rx="9" ry="7" transform="rotate(-20 322 150)"/>
    <path d="M330 148 V116 Q342 118 344 132" fill="none" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
  </g>

  <g transform="translate(140 78)"><path class="spark" fill="#fde047" d="M0 -10 L3 -3 L10 0 L3 3 L0 10 L-3 3 L-10 0 L-3 -3 Z"/></g>
  <g transform="translate(262 70)"><path class="spark s2" fill="#fde047" d="M0 -10 L3 -3 L10 0 L3 3 L0 10 L-3 3 L-10 0 L-3 -3 Z"/></g>

  <g class="bob">
    <ellipse cx="160" cy="338" rx="30" ry="14" fill="#fbbf24" stroke="#2e1065" stroke-width="5"/>
    <ellipse cx="240" cy="338" rx="30" ry="14" fill="#fbbf24" stroke="#2e1065" stroke-width="5"/>

    <ellipse cx="82" cy="276" rx="14" ry="26" transform="rotate(-20 82 276)" fill="#8b5cf6" stroke="#2e1065" stroke-width="5"/>

    <path d="M100 240 C100 150 150 110 200 110 C250 110 300 150 300 240 C300 300 260 336 200 336 C140 336 100 300 100 240 Z" fill="#8b5cf6" stroke="#2e1065" stroke-width="6" stroke-linejoin="round"/>
    <ellipse cx="200" cy="284" rx="62" ry="46" fill="#c4b5fd"/>
    <text x="200" y="294" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="26" font-weight="bold" fill="#5b21b6">&lt;/&gt;</text>
    <path d="M122 190 C128 160 148 138 172 128" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity=".35"/>

    <path d="M108 196 C108 70 292 70 292 196" fill="none" stroke="#2e1065" stroke-width="15" stroke-linecap="round"/>
    <path d="M108 196 C108 70 292 70 292 196" fill="none" stroke="#6d28d9" stroke-width="7" stroke-linecap="round"/>
    <ellipse cx="102" cy="206" rx="22" ry="34" fill="#22c55e" stroke="#2e1065" stroke-width="5"/>
    <ellipse cx="298" cy="206" rx="22" ry="34" fill="#22c55e" stroke="#2e1065" stroke-width="5"/>
    <ellipse cx="97" cy="206" rx="7" ry="18" fill="#86efac" opacity=".7"/>
    <ellipse cx="293" cy="206" rx="7" ry="18" fill="#86efac" opacity=".7"/>

    <g class="crown">
      <path d="M168 104 L172 68 L187 86 L200 56 L213 86 L228 68 L232 104 Z" fill="#fbbf24" stroke="#2e1065" stroke-width="5" stroke-linejoin="round"/>
      <circle cx="172" cy="66" r="5" fill="#f87171" stroke="#2e1065" stroke-width="2.5"/>
      <circle cx="200" cy="54" r="6" fill="#fff" stroke="#2e1065" stroke-width="2.5"/>
      <circle cx="228" cy="66" r="5" fill="#f87171" stroke="#2e1065" stroke-width="2.5"/>
    </g>

    <g class="eyes">
      <ellipse cx="170" cy="208" rx="20" ry="25" fill="#fff" stroke="#2e1065" stroke-width="4"/>
      <ellipse cx="230" cy="208" rx="20" ry="25" fill="#fff" stroke="#2e1065" stroke-width="4"/>
      <g class="pupils">
        <ellipse cx="172" cy="212" rx="11" ry="15" fill="#1f1147"/>
        <ellipse cx="228" cy="212" rx="11" ry="15" fill="#1f1147"/>
        <circle cx="177" cy="205" r="4.5" fill="#fff"/>
        <circle cx="233" cy="205" r="4.5" fill="#fff"/>
        <circle cx="168" cy="218" r="2" fill="#fff"/>
        <circle cx="224" cy="218" r="2" fill="#fff"/>
      </g>
    </g>

    <ellipse cx="138" cy="240" rx="13" ry="8" fill="#f472b6" opacity=".6"/>
    <ellipse cx="262" cy="240" rx="13" ry="8" fill="#f472b6" opacity=".6"/>

    <path d="M178 248 Q200 284 222 248 Z" fill="#1f1147"/>
    <g clip-path="url(#mouth)"><ellipse cx="200" cy="268" rx="13" ry="9" fill="#fb7185"/></g>
    <path d="M178 248 Q200 284 222 248 Z" fill="none" stroke="#2e1065" stroke-width="4" stroke-linejoin="round"/>

    <g class="wave">
      <ellipse cx="318" cy="272" rx="14" ry="26" transform="rotate(20 318 272)" fill="#8b5cf6" stroke="#2e1065" stroke-width="5"/>
    </g>
  </g>
</svg>
